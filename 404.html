<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting to FoxLINK...</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            padding: 2rem;
        }
        h2 {
            color: #ff5722;
        }
        a {
            color: #ff5722;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container" id="content">
        <h2>FoxLINK</h2>
        <p>Taking you to your destination...</p>
    </div>

    <script>
        // Start high-precision timer right when the page script executes
        const startTime = performance.now();

        async function handleRedirect() {
            const linkID = window.location.pathname.replace(/^\/+/, '');
            
            if (!linkID || linkID === 'index.html' || linkID === '404.html') {
                window.location.href = '/';
                return;
            }

            // Helper function to handle tracking, performance logging, and the strict 0.5s redirect cap
            function executeRedirect(url) {
                const timestamp = new Date().toISOString();
                
                // 1. Original click tracker form
                const clickFormUrl = `https://docs.google.com/forms/d/e/1FAIpQLScF6clFT63nqrz_9VOViea88eK8eLIvzurkDa-6laRoU9SmJw/formResponse?entry.2059016958=${encodeURIComponent(timestamp)}&entry.334692480=${encodeURIComponent(linkID)}`;
                fetch(clickFormUrl, { mode: 'no-cors' }).catch(() => {});

                // 2. New performance/response time tracker form
                const responseTimeMS = Math.round(performance.now() - startTime);
                const perfFormUrl = `https://docs.google.com/forms/d/e/1FAIpQLScxt_H77vasdjZy-nOgJEnoPq163X_R1O0Fr4QoKoB3NnHJbQ/formResponse?entry.1229030599=${encodeURIComponent(linkID)}&entry.1386678927=${encodeURIComponent(responseTimeMS)}`;
                fetch(perfFormUrl, { mode: 'no-cors' }).catch(() => {});

                // Enforce the strict 500ms (0.5s) minimum delay to prevent DNS auto-fill issues in Chrome
                // We factor in how long the script took to fetch data first, ensuring a smooth minimum cap
                const elapsed = performance.now() - startTime;
                const remainingDelay = Math.max(0, 500 - elapsed);

                setTimeout(() => {
                    window.location.replace(url);
                }, remainingDelay);
            }

            const API_URL = "https://script.google.com/macros/s/AKfycbxxINZvgAnE_SFVf_dpj8kNuvughXmM6deYfq52bPwfe8HAu4BBsFsveL14vGMokErU/exec";

            try {
                let linkMap = {};
                let cachedData = localStorage.getItem('fox_link_map');

                if (cachedData) {
                    try {
                        linkMap = JSON.parse(cachedData);
                    } catch (e) {
                        linkMap = {};
                    }
                }

                // Check if the linkID exists in our current local cache
                let longUrl = linkMap[linkID];

                // If not found in cache, fetch fresh data from Google Apps Script and overwrite cache
                if (!longUrl) {
                    const response = await fetch(API_URL);
                    linkMap = await response.json();
                    
                    // Overwrite old cache with fresh data
                    localStorage.setItem('fox_link_map', JSON.stringify(linkMap));
                    
                    // Check again after refreshing
                    longUrl = linkMap[linkID];
                }

                if (longUrl) {
                    executeRedirect(longUrl);
                } else {
                    document.getElementById('content').innerHTML = `
                        <h2>404 - FoxLINK Not Found</h2>
                        <p>The short link <strong>/${linkID}</strong> does not exist or has been removed.</p>
                        <p><a href="/">Create a new FoxLINK</a></p>
                    `;
                }
            } catch (error) {
                console.error("Redirect error:", error);
                document.getElementById('content').innerHTML = `
                    <h2>Error</h2>
                    <p>Could not resolve this FoxLINK. Please check your connection or try again later.</p>
                `;
            }
        }

        handleRedirect();
    </script>
</body>
</html>
